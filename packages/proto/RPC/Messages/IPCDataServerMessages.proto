syntax = "proto3";
import "google/protobuf/any.proto";
import "RPC/Events/SessionEvent.proto";

package IRacingTools.Models.RPC.DataServer;

message IPCDataServerClientMetadata {
  string id = 1;
  string name = 2;
  uint32 pid = 5;
  uint32 connection_id = 10;
}

message IPCDataServerState {
  int32 active_session_id = 1;

  map<uint32, IPCDataServerClientMetadata> client_map = 10;
  map<string, uint32> connection_client_map = 11;

}

message IPCDataServerHeaders {
    repeated RPC.Events.SessionDataVarHeader headers = 1;
}

message IPCDataServerSetSubscriptions {
  repeated RPC.Events.SessionEventType event_types = 1;
  repeated string data_var_header_names = 10;
}

message IPCDataServerMessage {
  enum Type {
    TYPE_EVENT = 0;
    TYPE_SET_CLIENT_METADATA = 1;
    TYPE_GET_DATA_HEADERS = 2;
    TYPE_SET_SUBSCRIPTIONS = 3;
  }

  Type type = 1;

  string client_id = 2;
  uint32 connection_id = 3;

  google.protobuf.Any payload = 10;
}

