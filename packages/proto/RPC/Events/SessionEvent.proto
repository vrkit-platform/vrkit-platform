syntax = "proto3";
import "Session/SessionState.proto";

package VRKit.Models.RPC.Events;

enum SessionEventType {
  SESSION_EVENT_TYPE_UNKNOWN = 0;
  SESSION_EVENT_TYPE_SESSION_CHANGED = 1;
  SESSION_EVENT_TYPE_METADATA_CHANGED = 2;
  SESSION_EVENT_TYPE_DATA_FRAME = 3;
}

message SessionChangedEvent {
  bool is_available = 1;
  optional uint32 session_id = 2;
  optional Session.SessionMetadata session_metadata = 10;
}

message SessionEventData {
  SessionEventType type = 1;
  string session_id = 10;
  Session.SessionType session_type = 11;

  oneof payload {
    SessionChangedEvent session_changed_event = 50;
    Session.SessionMetadata session_metadata = 52;
    Session.SessionDataFrame session_data_frame = 53;
  };
}
