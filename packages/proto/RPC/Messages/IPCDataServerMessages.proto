syntax = "proto3";
import "google/protobuf/any.proto";
import "RPC/Events/SessionEvent.proto";
import "Session/SessionState.proto";

package IRacingTools.Models.RPC.DataServer;

message IPCDataServerClientMetadata {
  uint32 id = 1;
  string name = 2;
  uint32 pid = 5;
}

message IPCDataServerSessionDataVarHeaders {
    repeated Session.SessionDataVarHeader headers = 1;
}

message IPCDataServerSetSubscriptions {
  repeated RPC.Events.SessionEventType event_types = 1;
  repeated string data_var_header_names = 10;
}

message IPCDataServerError {
  string code = 1;
  string message = 2;
  string stack_trace = 3;
}

message IPCDataServerMessage {
  enum Type {
    TYPE_EVENT = 0;
    TYPE_SET_CLIENT_METADATA = 1;
    TYPE_GET_SESSION_METADATA = 3;
    TYPE_GET_SESSION_DATA_HEADERS = 4;
    TYPE_SET_SUBSCRIPTIONS = 5;
  }

  Type type = 1;
  optional RPC.Events.SessionEventType event_type = 2;

  bool is_error = 8;

  optional IPCDataServerError error = 9;

  google.protobuf.Any payload = 10;


}
